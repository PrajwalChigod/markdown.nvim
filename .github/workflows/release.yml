name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not major.minor.patch (e.g. 0.1.0, no v prefix)"
            exit 1
          fi

      - name: Check version
        run: |
          version=$(sed -n "s/^M.version = '\(.*\)'$/\1/p" lua/renderer/health.lua)
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match health.lua version $version"
            exit 1
          fi

      - name: Extract release notes
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no '## $TAG' section in CHANGELOG.md"
            exit 1
          fi

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --title "$TAG" --notes-file notes.md
