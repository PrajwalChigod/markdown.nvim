name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check version
        run: |
          version=$(sed -n "s/^M.version = '\(.*\)'$/\1/p" lua/render-markdown/health.lua)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match health.lua version $version"
            exit 1
          fi

      - name: Extract release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no '## $GITHUB_REF_NAME' section in CHANGELOG.md"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
